services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "3000:3000"
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
      RUST_LOG: ${RUST_LOG:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_VERBOSE_DEBUG: ${LOG_VERBOSE_DEBUG:-false}
      METRICS_ENABLED: "true"
      METRICS_PATH: /metrics
      OPMUX_CONFIG_FILE: /app/config/opmux.example.json
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy-key}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:9/v1}
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - ./config/opmux.example.json:/app/config/opmux.example.json:ro
