name: Security Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Build, test, migrate, and startup checks live in ci.yml with disposable
# Postgres. This workflow only scans committed configuration.
jobs:
  security-check:
    name: Security Configuration Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security checks
        run: ./scripts/check-security.sh

      - name: Verify no development mode in environment
        run: |
          if [ "$AUTH_DEVELOPMENT_MODE" = "true" ]; then
            echo "SECURITY VIOLATION: AUTH_DEVELOPMENT_MODE is set to true in CI environment"
            exit 1
          fi
